[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowmcp"
version = "1.0.0"
description = "A consolidated ServiceNow MCP server: thirteen tools, local storage, minimal calls."
requires-python = ">=3.11"
dependencies = ["mcp>=2.0"]

[project.scripts]
snowmcp = "snowmcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: crosses a real layer boundary",
    "qa: whole-stack acceptance and architecture checks",
]

[tool.coverage.run]
branch = true
source = ["snowmcp"]

[tool.mutmut]
source_paths = ["src"]
# mutmut already passes -x, so a mutant only has to fail one test to be
# killed. -p no:cacheprovider stops it rewriting the pytest cache thousands
# of times over a full run.
pytest_add_cli_args = ["tests", "-p", "no:cacheprovider"]
# mutmut's default wall-clock limit is (estimated_time + 1) * 15. On a
# loaded four-core box that is not enough for a 10-second suite, and a
# worker killed for overrunning is *not* a killed mutant - it counts
# against the score. Give the workers room so a timeout means a real
# infinite loop rather than a busy machine.
timeout_constant = 30.0
timeout_multiplier = 60.0
# The business logic is where mutation testing earns its keep. The adapters
# are transport and schema plumbing, which the contract tests cover exactly
# (exact path, method, query parameters, body). Scope is stated here so the
# score is never mistaken for a full-tree number.
only_mutate = ["src/snowmcp/domain/*", "src/snowmcp/application/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A Protocol's method body is a declaration, never executed by design.
    "^\\s*def .*\\.\\.\\.\\s*$",
    "@(abc\\.)?abstractmethod",
    # The module entry-point guard runs only under `python -m`.
    "^\\s*if __name__ == .__main__.:$",
]
